server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Rutas como /clients o /accounts/17 las resuelve Angular en el navegador:
    # si no existe un archivo con ese nombre, se entrega index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Mismo papel que proxy.conf.json en desarrollo: el navegador solo habla con este servidor
    # y nginx reenvía /api al contenedor del backend. Al ser el mismo origen, no hace falta CORS.
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
